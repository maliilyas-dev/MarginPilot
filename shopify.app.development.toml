# MarginPilot — development app configuration.
# Link with:  shopify app config link --config development
# Select with: shopify app config use development
# Deploy with: shopify app deploy --config development

name = "MarginPilotdevelopment"
handle = "marginpilotdevelopment-development"
application_url = "https://REPLACE-WITH-development-URL"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations"

[auth]
redirect_urls = [
  "https://REPLACE-WITH-development-URL/auth/callback",
  "https://REPLACE-WITH-development-URL/auth/shopify/callback",
  "https://REPLACE-WITH-development-URL/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[build]
automatically_update_urls_on_dev = true
