# MarginPilot — production app configuration.
# Link with:  shopify app config link --config production
# Select with: shopify app config use production
# Deploy with: shopify app deploy --config production

name = "MarginPilot"
handle = "marginpilot-production"
application_url = "https://REPLACE-WITH-production-URL"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations"

[auth]
redirect_urls = [
  "https://REPLACE-WITH-production-URL/auth/callback",
  "https://REPLACE-WITH-production-URL/auth/shopify/callback",
  "https://REPLACE-WITH-production-URL/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[build]
automatically_update_urls_on_dev = false
