# MarginPilot — production app configuration.
# Link with:  shopify app config link --config production
# Select with: shopify app config use production
# Deploy with: shopify app deploy --config production
#
# NOTE: shopify.app.margin-pilot.toml is the linked / active config. This file
# is a reference mirror of the production settings.

client_id = "fbbaded3ccef01d48a75b86d52b5c1d8"

name = "MarginPilot"
application_url = "https://marginpilot-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations"

[auth]
redirect_urls = [
  "https://marginpilot-production.up.railway.app/auth/callback",
  "https://marginpilot-production.up.railway.app/auth/shopify/callback",
  "https://marginpilot-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[build]
automatically_update_urls_on_dev = false
