# MarginPilot — Shopify app configuration (linked to "Margin Pilot").
# `shopify app deploy` uploads this. application_url + redirect_urls are set to
# the production URL once hosting is live (see BUILD_REPORT.md §4).

client_id = "f05f1392668f7e783075813eda565f20"
name = "Margin Pilot"
handle = "margin-pilot"
application_url = "https://marginpilot-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations"

[auth]
redirect_urls = [
  "https://marginpilot-production.up.railway.app/auth/callback",
  "https://marginpilot-production.up.railway.app/auth/shopify/callback",
  "https://marginpilot-production.up.railway.app/api/auth/callback"
]

# 2026-07 is the latest stable release supported by the installed
# @shopify/shopify-app-react-router SDK. 2026-10 is a release candidate as of
# this build date and must not be used in production (spec rule 4).
[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[pos]
embedded = false
