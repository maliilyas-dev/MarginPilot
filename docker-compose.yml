# Local development datastores for MarginPilot.
# `docker compose up -d` then `npm run db:migrate:dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marginpilot
      POSTGRES_PASSWORD: marginpilot
      POSTGRES_DB: marginpilot
    ports:
      - "5432:5432"
    volumes:
      - marginpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - marginpilot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marginpilot_pg:
  marginpilot_redis:
