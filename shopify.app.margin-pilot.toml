# MarginPilot — Shopify app configuration.
# Linked app: "margin-pilot" in the AIDev Labs Partner org (client_id below).
# This is the DEFAULT / linked config (see .shopify). `shopify app deploy`
# uploads it. shopify.app.production.toml / .development.toml are reference
# copies only — this file is the source of truth.

client_id = "fbbaded3ccef01d48a75b86d52b5c1d8"
name = "MarginPilot"
handle = "marginpilot"
application_url = "https://marginpilot-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations"

[auth]
redirect_urls = [
  "https://marginpilot-production.up.railway.app/auth/callback",
  "https://marginpilot-production.up.railway.app/auth/shopify/callback",
  "https://marginpilot-production.up.railway.app/api/auth/callback"
]

# 2026-07 is the latest stable release the installed
# @shopify/shopify-app-react-router SDK supports and the version the build spec
# targets. 2026-10 is a release candidate as of the build date and must not be
# used in production (spec rule 4). Keep in sync with app/config/apiVersion.ts
# and app/shopify.server.ts.
[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[pos]
embedded = false
